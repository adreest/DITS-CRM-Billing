name: Build Admin and Customer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK files
        run: gradle :adminApp:assembleDebug :customerApp:assembleDebug

      - name: Rename APK files
        run: |
          mkdir -p final-apk
          cp adminApp/build/outputs/apk/debug/adminApp-debug.apk final-apk/Admin-App.apk
          cp customerApp/build/outputs/apk/debug/customerApp-debug.apk final-apk/Customer-App.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DITS-CRM-Billing-APK-Files
          path: final-apk/*.apk
